<!DOCTYPE html>
<html>
  <head>
    <title>Money Deposit</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="/client.js" defer></script>
  </head>
  <body>
    <div class="sticky">
      <ul id="Nav_Bar">
        <li><a>Home</a></li>
        <li><a>News</a></li>
        <li><a>Contact</a></li>
        <li><a>Login</a></li>
      </ul>
    </div>

    <header>
      <h1>How much money do you want to deposit?</h1>
    </header>

    <main>
      <section>
        <h3>Register an account</h3>
        <form id="register-form">
          <label>New IBAN:</label>
          <input id="register-IBAN" type="text" placeholder="1234567891234567891234" /> <br /><br />
          <label>New PIN:</label>
          <input id="register-PIN" type="text" placeholder="2468" /> <br /><br />
          <button id="register-btn" type="submit">Register</button>
        </form>
      </section>

      <section>
        <h3>User</h3>
        <form id="deposit-form">
          <label>IBAN:</label>
          <input id="IBAN" type="text" placeholder="1234567891234567891234" /> <br /><br />
          <label>PIN:</label>
          <input id="PIN" type="text" placeholder="2468" /> <br /><br />
          <label>Deposit amount:</label>
          <input id="DepAm" type="number" step="any" placeholder="€10000000" /> <br /><br />

          <button id="submit-btn" type="submit">Submit</button>
        </form>
      </section>

      <p>Entries:</p>
      <section>
        <ul id="Entries"></ul>
      </section>
    </main>
  </body>
</html>
